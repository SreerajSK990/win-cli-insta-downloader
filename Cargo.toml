[package]
name = "insta"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
rust-embed = "8.5"
dirs = "5.0"
open = "5.3"
regex = "1.10"
futures-util = "0.3"
mime_guess = "2.0"
